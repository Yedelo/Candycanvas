modLoader = "javafml"
loaderVersion = "[1,)"
license = "${license}"
issueTrackerURL = "https://github.com/Yedelo/${modName}/issues"

[[mods]]
modId = "${modId}"
version = "${version}"
displayName = "${modName}"
description = "${modDescription}"
logoFile = "${modIcon}"
logoBlur = false
authors = "Yedel"
displayURL = "https://modrinth.com/mod/${modId}/"

[[mixins]]
config = "${modId}.mixins.json5"

[features.${modId}]
javaVersion = "${java}"

[[dependencies.${modId}]]
modId = "neoforge"
versionRange = "${neoforge}"

[[dependencies.${modId}]]
modId = "minecraft"
versionRange = "${minecraft}"

[[dependencies.${modId}]]
modId = "supermartijn642configlib"
versionRange = "${smcl}"